<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d0c4"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#1c2128" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="#0d1117"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- faint dot grid, right third only, subtle -->
  <g fill="#30363d" opacity="0.45">
    <circle cx="920" cy="40" r="1.4"/><circle cx="960" cy="40" r="1.4"/><circle cx="1000" cy="40" r="1.4"/><circle cx="1040" cy="40" r="1.4"/><circle cx="1080" cy="40" r="1.4"/><circle cx="1120" cy="40" r="1.4"/><circle cx="1160" cy="40" r="1.4"/><circle cx="1200" cy="40" r="1.4"/><circle cx="1240" cy="40" r="1.4"/>
    <circle cx="920" cy="80" r="1.4"/><circle cx="960" cy="80" r="1.4"/><circle cx="1000" cy="80" r="1.4"/><circle cx="1040" cy="80" r="1.4"/><circle cx="1080" cy="80" r="1.4"/><circle cx="1120" cy="80" r="1.4"/><circle cx="1160" cy="80" r="1.4"/><circle cx="1200" cy="80" r="1.4"/><circle cx="1240" cy="80" r="1.4"/>
    <circle cx="920" cy="120" r="1.4"/><circle cx="960" cy="120" r="1.4"/><circle cx="1000" cy="120" r="1.4"/><circle cx="1040" cy="120" r="1.4"/><circle cx="1080" cy="120" r="1.4"/><circle cx="1120" cy="120" r="1.4"/><circle cx="1160" cy="120" r="1.4"/><circle cx="1200" cy="120" r="1.4"/><circle cx="1240" cy="120" r="1.4"/>
    <circle cx="920" cy="160" r="1.4"/><circle cx="960" cy="160" r="1.4"/><circle cx="1000" cy="160" r="1.4"/><circle cx="1040" cy="160" r="1.4"/><circle cx="1080" cy="160" r="1.4"/><circle cx="1120" cy="160" r="1.4"/><circle cx="1160" cy="160" r="1.4"/><circle cx="1200" cy="160" r="1.4"/><circle cx="1240" cy="160" r="1.4"/>
  </g>

  <!-- radar sweep motif, abstract, right side -->
  <circle cx="1080" cy="180" r="90" fill="none" stroke="#21262d" stroke-width="1"/>
  <circle cx="1080" cy="180" r="60" fill="none" stroke="#21262d" stroke-width="1"/>
  <circle cx="1080" cy="180" r="30" fill="none" stroke="#21262d" stroke-width="1"/>
  <circle cx="1080" cy="180" r="3.5" fill="#3fb950"/>
  <circle cx="1140" cy="150" r="3" fill="#d29922"/>
  <circle cx="1035" cy="230" r="2.5" fill="#79c0ff"/>
  <line x1="1080" y1="90" x2="1080" y2="270" stroke="#21262d" stroke-width="1"/>
  <line x1="990" y1="180" x2="1170" y2="180" stroke="#21262d" stroke-width="1"/>

  <!-- left accent rule -->
  <rect x="64" y="72" width="4" height="120" fill="url(#accent)"/>

  <!-- name -->
  <text x="92" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e6edf3" letter-spacing="0.5">Abijit</text>

  <!-- tagline -->
  <text x="92" y="163" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Detection engineering &amp; blue team security &#8212; CS student</text>

  <!-- tag chips -->
  <g font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="600">
    <rect x="92" y="188" width="88" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="136" y="205" fill="#79c0ff" text-anchor="middle">SIEM</text>

    <rect x="188" y="188" width="98" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="237" y="205" fill="#79c0ff" text-anchor="middle">MITRE ATT&amp;CK</text>

    <rect x="294" y="188" width="96" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="342" y="205" fill="#79c0ff" text-anchor="middle">Detection Eng</text>

    <rect x="398" y="188" width="82" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="439" y="205" fill="#79c0ff" text-anchor="middle">Python</text>

    <rect x="488" y="188" width="72" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="524" y="205" fill="#79c0ff" text-anchor="middle">Wazuh</text>
  </g>

  <!-- status line -->
  <circle cx="98" cy="248" r="4" fill="#3fb950"/>
  <text x="112" y="252" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#8b949e">open to SOC analyst roles &#183; final-year placements 2027&#8211;2028</text>
</svg>
